name: Native distribution
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      DSH_NATIVE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup override set stable && rustup target add "$DSH_NATIVE_TARGET"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify native executable startup
        run: |
          file lib/native/${{ matrix.platform }}/backend
          lib/native/${{ matrix.platform }}/backend --version
      - run: npm run check
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.platform }}
          path: lib/native/
          if-no-files-found: error
  package:
    needs: binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup override set stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-*
          path: native-artifacts
          merge-multiple: true
      - run: node scripts/assemble-native.mjs native-artifacts
      - run: npm pack --ignore-scripts
      - name: Verify assembled package
        run: |
          archive="$(node -p "'dsh-remote-agents-'+require('./package.json').version+'.tgz'")"
          npm run test:package -- "$archive"
          tar -tzf "$archive" | grep 'lib/native/.*/backend' | tee native-platforms.txt
          test "$(wc -l < native-platforms.txt)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-all-platforms
          path: '*.tgz'
          if-no-files-found: error
  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-all-platforms
          path: npm-package
      - name: Publish verified archive to npm
        shell: bash
        run: |
          archives=(./npm-package/*.tgz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "Expected exactly one verified npm archive" >&2
            exit 1
          fi
          archive="${archives[0]}"
          tar -xOf "$archive" package/package.json > npm-package/package.json
          version="$(node -p "require('./npm-package/package.json').version")"
          dist_tag="$(node -p "require('./npm-package/package.json').publishConfig?.tag || 'latest'")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          npm publish "$archive" --access public --tag "$dist_tag" --ignore-scripts
