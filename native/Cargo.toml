[package]
name = "dsh-remote-agents-backend"
version = "0.5.0-alpha.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_yaml_ng = "0.10"
yaml-edit = "0.3"

[dev-dependencies]
tempfile = "3"
